[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Do NOT run migrate here — Railway MySQL already has tables / use SQL dump import.
# A previous UI "Pre-deploy Command" of `php artisan migrate` was failing deploys.
preDeployCommand = ["true"]
healthcheckPath = "/up"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
startCommand = "railway-start.sh"
